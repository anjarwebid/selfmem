services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: selfmem
      POSTGRES_USER: selfmem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfmem"]
      interval: 5s
      timeout: 5s
      retries: 5

  selfmem:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://selfmem:${POSTGRES_PASSWORD:-changeme}@db:5432/selfmem
      - SELFMEM_API_KEYS=${SELFMEM_API_KEYS}
      - SELFMEM_SESSION_SECRET=${SELFMEM_SESSION_SECRET:-change-me-in-production}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    depends_on:
      - db

volumes:
  pgdata:

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: selfmem
      POSTGRES_USER: selfmem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfmem"]
      interval: 5s
      timeout: 5s
      retries: 5

  selfmem:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://selfmem:${POSTGRES_PASSWORD:-changeme}@db:5432/selfmem
      - SELFMEM_SESSION_SECRET=${SELFMEM_SESSION_SECRET:-change-me-in-production}
      - SELFMEM_HOSTING_MODE=${SELFMEM_HOSTING_MODE:-selfhosted}
      - SELFMEM_PUBLIC_URL=${SELFMEM_PUBLIC_URL:-http://localhost:8818}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      # SaaS quotas (only enforced when SELFMEM_HOSTING_MODE=saas)
      - SELFMEM_FREE_MEMORY_LIMIT=${SELFMEM_FREE_MEMORY_LIMIT:-100}
      - SELFMEM_FREE_PROJECT_LIMIT=${SELFMEM_FREE_PROJECT_LIMIT:-1}
      - SELFMEM_FREE_MEMBER_LIMIT=${SELFMEM_FREE_MEMBER_LIMIT:-1}
      - SELFMEM_FREE_API_LIMIT_DAILY=${SELFMEM_FREE_API_LIMIT_DAILY:-100}
    ports:
      - "8818:8818"
    depends_on:
      - db

volumes:
  pgdata:

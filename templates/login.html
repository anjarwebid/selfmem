<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfMem - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0f] text-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="bg-[#111118] border border-[#35354a] rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold tracking-tight">SelfMem</h1>
                <p class="text-sm text-gray-500 mt-2">Personal Memory Server</p>
            </div>

            {% if error %}
            <div class="mb-4 px-4 py-3 rounded-lg bg-red-900/50 border border-red-700 text-red-200 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/ui/login">
                <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2">API Key</label>
                <input type="password"
                       name="api_key"
                       required
                       autofocus
                       placeholder="Enter your API key"
                       class="w-full bg-[#1a1a24] border border-[#35354a] rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-600">
                <button type="submit"
                        class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition-colors text-sm">
                    Sign In
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-gray-600 mt-6">v1.0.0</p>
    </div>
</body>
</html>

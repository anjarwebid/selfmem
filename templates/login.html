<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfMem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-[#08080c] text-gray-100 min-h-screen flex items-center justify-center">
    <!-- Subtle background glow -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-cyan-500/[0.03] rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-sm relative login-card">
        <div class="bg-[#0e0e14] border border-white/[0.06] rounded-2xl p-8 shadow-2xl">
            <!-- Brand -->
            <div class="flex items-center justify-center gap-2.5 mb-8">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-500 to-cyan-700 flex items-center justify-center">
                    <svg class="w-4.5 h-4.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-white tracking-tight">SelfMem</h1>
                    <p class="text-[10px] text-gray-600 font-mono uppercase tracking-widest">memory server</p>
                </div>
            </div>

            {% if error %}
            <div class="mb-5 px-4 py-3 rounded-lg bg-red-950/50 border border-red-800/30 text-red-300 text-sm flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/ui/login">
                <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-2">API Key</label>
                <input type="password"
                       name="api_key"
                       required
                       autofocus
                       placeholder="Enter your API key"
                       class="w-full bg-[#16161f] border border-white/[0.06] rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500/30 focus:border-cyan-500/30 placeholder-gray-700 transition-all">
                <button type="submit"
                        class="btn-primary mt-5 w-full bg-gradient-to-r from-cyan-600 to-cyan-700 hover:from-cyan-500 hover:to-cyan-600 text-white font-medium py-3 rounded-lg text-sm">
                    Sign In
                </button>
            </form>
        </div>
        <p class="text-center text-[11px] text-gray-700 mt-5 font-mono">v1.0.0</p>
    </div>
</body>
</html>

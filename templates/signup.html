<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — SelfMem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-[#08080c] text-gray-100 min-h-screen flex items-center justify-center">
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-cyan-500/[0.03] rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-sm relative login-card">
        <div class="bg-[#0e0e14] border border-white/[0.06] rounded-2xl p-8 shadow-2xl">
            <div class="flex items-center justify-center gap-2.5 mb-8">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-500 to-cyan-700 flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-white tracking-tight">SelfMem</h1>
                    <p class="text-[10px] text-gray-600 font-mono uppercase tracking-widest">create account</p>
                </div>
            </div>

            {% if error %}
            <div class="mb-5 px-4 py-3 rounded-lg bg-red-950/50 border border-red-800/30 text-red-300 text-sm">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/ui/signup" class="space-y-4">
                <div>
                    <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-2">Email</label>
                    <input type="email" name="email" required autofocus
                           class="w-full bg-[#16161f] border border-white/[0.06] rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500/30">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-2">Password</label>
                    <input type="password" name="password" required minlength="8"
                           class="w-full bg-[#16161f] border border-white/[0.06] rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500/30">
                    <p class="text-[10px] text-gray-700 mt-1.5">Minimum 8 characters</p>
                </div>
                <button type="submit"
                        class="btn-primary w-full bg-gradient-to-r from-cyan-600 to-cyan-700 hover:from-cyan-500 hover:to-cyan-600 text-white font-medium py-3 rounded-lg text-sm">
                    Create account
                </button>
            </form>

            <p class="text-center text-[12px] text-gray-600 mt-6">
                Already have an account? <a href="/ui/login" class="text-cyan-500/80 hover:text-cyan-400">Sign in</a>
            </p>
        </div>
    </div>
</body>
</html>

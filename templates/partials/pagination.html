<div class="flex items-center justify-between mt-5 pt-4 border-t border-white/[0.04]">
    <span class="text-[11px] text-gray-700 font-mono">page {{ page }}/{{ total_pages }}</span>
    <div class="flex gap-2">
        {% if page > 1 %}
        <button hx-get="/ui/partials/memories?page={{ page - 1 }}"
                hx-target="#memory-list"
                hx-include="#filter-form, #search-input, #category-select"
                class="px-4 py-1.5 text-sm text-gray-500 bg-surface-700 hover:bg-surface-600 rounded-lg transition-colors">Prev</button>
        {% endif %}
        {% if page < total_pages %}
        <button hx-get="/ui/partials/memories?page={{ page + 1 }}"
                hx-target="#memory-list"
                hx-include="#filter-form, #search-input, #category-select"
                class="px-4 py-1.5 text-sm text-gray-500 bg-surface-700 hover:bg-surface-600 rounded-lg transition-colors">Next</button>
        {% endif %}
    </div>
</div>

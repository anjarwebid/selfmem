<div id="memory-list" class="space-y-2.5 stagger">
    {% if memories %}
    {% for mem in memories %}
    {% include "partials/memory_row.html" %}
    {% endfor %}

    {% if total_pages is defined and total_pages > 1 %}
    {% include "partials/pagination.html" %}
    {% endif %}
    {% else %}
    <div class="empty-state text-center py-16 rounded-xl">
        <svg class="w-10 h-10 text-gray-800 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <p class="text-gray-600 text-sm">No memories found</p>
        <p class="text-gray-800 text-xs mt-1">Try a different search or add a new memory</p>
    </div>
    {% endif %}
</div>

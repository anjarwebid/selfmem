<div class="bg-dark-800 border border-dark-600 rounded-xl p-4 group" id="memory-{{ mem.id }}">
    <div class="flex items-start justify-between gap-4">
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
                <span class="inline-block bg-blue-900/50 text-blue-300 text-xs px-2.5 py-0.5 rounded-full border border-blue-800">{{ mem.category }}</span>
                {% for tag in mem.tags %}
                <span class="inline-block bg-dark-700 text-gray-400 text-xs px-2 py-0.5 rounded-full">{{ tag }}</span>
                {% endfor %}
            </div>
            <div class="text-sm text-gray-300 whitespace-pre-wrap cursor-pointer line-clamp-3"
                 onclick="this.classList.toggle('line-clamp-3')"
                 title="Click to expand/collapse">{{ mem.content }}</div>
            <div class="flex items-center gap-4 mt-3 text-xs text-gray-600">
                <span>{{ mem.updated_at[:16] if mem.updated_at else '' }}</span>
                <span class="font-mono text-gray-700">{{ mem.id[:8] }}</span>
                {% if mem.score is defined %}
                <span class="text-blue-500">score: {{ "%.3f"|format(mem.score) }}</span>
                {% endif %}
            </div>
        </div>
        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
            <button hx-get="/ui/partials/memory/{{ mem.id }}/edit"
                    hx-target="#memory-{{ mem.id }}"
                    hx-swap="outerHTML"
                    class="p-2 text-gray-500 hover:text-blue-400 transition-colors rounded-lg hover:bg-dark-700"
                    title="Edit">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
            <button hx-delete="/ui/memories/{{ mem.id }}"
                    hx-target="#memory-{{ mem.id }}"
                    hx-swap="outerHTML swap:300ms"
                    hx-confirm="Archive this memory?"
                    class="p-2 text-gray-500 hover:text-red-400 transition-colors rounded-lg hover:bg-dark-700"
                    title="Archive">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
        </div>
    </div>
</div>

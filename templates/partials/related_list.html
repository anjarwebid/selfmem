<div class="ml-4 mt-2 mb-3 space-y-1.5 border-l-2 border-cyan-900/30 pl-4" id="related-{{ source_id }}">
    <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] text-gray-600 uppercase tracking-widest font-mono">Related memories</span>
        <button onclick="document.getElementById('related-{{ source_id }}').remove()"
                class="text-gray-700 hover:text-gray-400 transition-colors p-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>
    {% if memories %}
    {% for mem in memories %}
    <a href="/ui/memories#memory-{{ mem.id }}" class="block bg-surface-900 border border-white/[0.03] rounded-lg p-3 hover:border-accent/15 hover:bg-surface-800 transition-all group">
        <div class="flex items-center gap-2 mb-1.5">
            <span class="badge-cyan text-[10px] px-2 py-0.5 rounded-md font-mono">{{ mem.category }}</span>
            {% if mem.project_id %}
            <span class="badge-ghost text-[10px] px-1.5 py-0.5 rounded-md font-mono">{{ mem.project_id }}</span>
            {% endif %}
            <span class="text-[10px] font-mono text-cyan-700 ml-auto">{{ "%.1f"|format(mem.similarity * 100) }}%</span>
        </div>
        <div class="text-[12px] text-gray-500 line-clamp-2 group-hover:text-gray-400 transition-colors">{{ mem.content }}</div>
    </a>
    {% endfor %}
    {% else %}
    <p class="text-[12px] text-gray-700">No related memories found</p>
    {% endif %}
</div>

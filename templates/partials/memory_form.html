<div class="bg-surface-800 border border-cyan-500/20 rounded-xl p-5" id="memory-{{ mem.id }}">
    <form hx-put="/ui/memories/{{ mem.id }}"
          hx-target="#memory-{{ mem.id }}"
          hx-swap="outerHTML">
        <textarea name="content" rows="4" required
                  class="w-full bg-surface-900 border border-white/[0.06] rounded-lg px-4 py-3 text-[13px] leading-relaxed focus:outline-none focus:ring-1 focus:ring-cyan-500/30 mb-4 transition-all">{{ mem.content }}</textarea>
        <div class="flex gap-3 mb-4">
            <div class="flex-1">
                <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-1.5">Category</label>
                <input type="text" name="category" value="{{ mem.category }}" placeholder="Category"
                       class="w-full bg-surface-900 border border-white/[0.06] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500/30 transition-all">
            </div>
            <div class="flex-1">
                <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-1.5">Tags</label>
                <input type="text" name="tags" value="{{ mem.tags|join(', ') }}" placeholder="comma-separated"
                       class="w-full bg-surface-900 border border-white/[0.06] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500/30 transition-all">
            </div>
        </div>
        <div class="flex justify-end gap-3">
            <button type="button"
                    hx-get="/ui/partials/memory/{{ mem.id }}"
                    hx-target="#memory-{{ mem.id }}"
                    hx-swap="outerHTML"
                    class="px-4 py-2 text-sm text-gray-500 hover:text-gray-300 transition-colors">Cancel</button>
            <button type="submit"
                    class="bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">Save</button>
        </div>
    </form>
</div>

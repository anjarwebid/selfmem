<div class="bg-dark-800 border border-blue-600 rounded-xl p-4" id="memory-{{ mem.id }}">
    <form hx-put="/ui/memories/{{ mem.id }}"
          hx-target="#memory-{{ mem.id }}"
          hx-swap="outerHTML">
        <textarea name="content" rows="4" required
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 mb-3">{{ mem.content }}</textarea>
        <div class="flex gap-3 mb-3">
            <div class="flex-1">
                <input type="text" name="category" value="{{ mem.category }}" placeholder="Category"
                       class="w-full bg-dark-900 border border-dark-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex-1">
                <input type="text" name="tags" value="{{ mem.tags|join(', ') }}" placeholder="Tags (comma-separated)"
                       class="w-full bg-dark-900 border border-dark-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
        </div>
        <div class="flex justify-end gap-2">
            <button type="button"
                    hx-get="/ui/partials/memory/{{ mem.id }}"
                    hx-target="#memory-{{ mem.id }}"
                    hx-swap="outerHTML"
                    class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">Cancel</button>
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">Save</button>
        </div>
    </form>
</div>

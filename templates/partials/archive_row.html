<div class="bg-dark-800 border border-dark-600 rounded-xl p-4 group opacity-75" id="archive-{{ mem.id }}">
    <div class="flex items-start justify-between gap-4">
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
                <span class="inline-block bg-red-900/30 text-red-400 text-xs px-2.5 py-0.5 rounded-full border border-red-800/50">archived</span>
                <span class="inline-block bg-dark-700 text-gray-500 text-xs px-2.5 py-0.5 rounded-full">{{ mem.category }}</span>
            </div>
            <div class="text-sm text-gray-400 whitespace-pre-wrap line-clamp-3">{{ mem.content }}</div>
            <div class="flex items-center gap-4 mt-3 text-xs text-gray-600">
                <span>Deleted: {{ mem.deleted_at[:16] if mem.deleted_at else '' }}</span>
                <span class="font-mono text-gray-700">{{ mem.id[:8] }}</span>
            </div>
        </div>
        <div class="flex items-center gap-1 shrink-0">
            <button hx-post="/ui/archive/{{ mem.id }}/restore"
                    hx-target="#archive-{{ mem.id }}"
                    hx-swap="outerHTML swap:300ms"
                    class="p-2 text-gray-500 hover:text-emerald-400 transition-colors rounded-lg hover:bg-dark-700"
                    title="Restore">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
            </button>
            <button hx-delete="/ui/archive/{{ mem.id }}"
                    hx-target="#archive-{{ mem.id }}"
                    hx-swap="outerHTML swap:300ms"
                    hx-confirm="Permanently delete? This cannot be undone."
                    class="p-2 text-gray-500 hover:text-red-400 transition-colors rounded-lg hover:bg-dark-700"
                    title="Purge permanently">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
        </div>
    </div>
</div>

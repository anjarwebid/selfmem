<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SelfMem{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: { 950: '#08080c', 900: '#0e0e14', 800: '#16161f', 700: '#1e1e2a', 600: '#2a2a3a', 500: '#3a3a50' },
                        accent: '#22d3ee'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-surface-950 text-gray-300 min-h-screen flex">

    <!-- Sidebar -->
    <nav class="w-60 bg-surface-900 flex flex-col fixed h-full z-10 border-r border-white/[0.04]" id="sidebar">
        <a href="/ui/" class="block px-5 py-6 hover:bg-white/[0.02] transition-colors">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-cyan-700 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <h1 class="text-[15px] font-semibold text-white tracking-tight">SelfMem</h1>
                    <p class="text-[10px] text-gray-600 font-mono uppercase tracking-widest">memory server</p>
                </div>
            </div>
        </a>

        <div class="glow-line mx-4"></div>

        <div class="px-4 py-4">
            <label class="text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-2 block">Active User</label>
            <select id="user-switcher"
                    class="w-full bg-surface-800 border border-white/[0.06] rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-accent/30 focus:ring-1 focus:ring-accent/20 transition-all"
                    hx-post="/ui/set-user"
                    hx-vals="js:{user_id: event.target.value}"
                    hx-swap="none"
                    hx-on::after-request="window.location.reload()">
                <option value="" {% if current_user == '__all__' %}selected{% endif %}>All Users</option>
                {% for user in users %}
                <option value="{{ user.user_id }}" {% if user.user_id == current_user %}selected{% endif %}>
                    {{ user.user_id }} ({{ user.count }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="flex-1 px-3 py-2 space-y-0.5">
            <a href="/ui/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] {{ 'nav-active bg-white/[0.04] text-white font-medium' if active_page == 'dashboard' else 'text-gray-500 hover:text-gray-300 hover:bg-white/[0.03]' }} transition-all">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                Dashboard
            </a>
            <a href="/ui/memories" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] {{ 'nav-active bg-white/[0.04] text-white font-medium' if active_page == 'memories' else 'text-gray-500 hover:text-gray-300 hover:bg-white/[0.03]' }} transition-all">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Memories
            </a>
            <a href="/ui/categories" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] {{ 'nav-active bg-white/[0.04] text-white font-medium' if active_page == 'categories' else 'text-gray-500 hover:text-gray-300 hover:bg-white/[0.03]' }} transition-all">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/></svg>
                Categories
            </a>
            <a href="/ui/tags" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] {{ 'nav-active bg-white/[0.04] text-white font-medium' if active_page == 'tags' else 'text-gray-500 hover:text-gray-300 hover:bg-white/[0.03]' }} transition-all">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"/></svg>
                Tags
            </a>
            <a href="/ui/archive" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] {{ 'nav-active bg-white/[0.04] text-white font-medium' if active_page == 'archive' else 'text-gray-500 hover:text-gray-300 hover:bg-white/[0.03]' }} transition-all">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                Archive
            </a>
            <a href="/ui/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] {{ 'nav-active bg-white/[0.04] text-white font-medium' if active_page == 'settings' else 'text-gray-500 hover:text-gray-300 hover:bg-white/[0.03]' }} transition-all">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Settings
            </a>
        </div>

        <div class="px-3 py-3 border-t border-white/[0.04]">
            <a href="/ui/logout" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] text-gray-600 hover:text-red-400 hover:bg-red-500/[0.05] transition-all">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Logout
            </a>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 ml-60 min-h-screen">
        <div class="max-w-5xl mx-auto px-8 py-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2.5"></div>

    <script>
        // Convert UTC timestamps to browser local time
        function localizeTimestamps() {
            document.querySelectorAll('[data-utc]').forEach(el => {
                const utc = el.getAttribute('data-utc');
                if (!utc) return;
                const d = new Date(utc);
                if (isNaN(d)) return;
                el.textContent = d.toLocaleString(undefined, {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
            });
        }
        localizeTimestamps();
        document.body.addEventListener('htmx:afterSwap', localizeTimestamps);

        document.body.addEventListener("showToast", function(evt) {
            const data = evt.detail;
            const toast = document.createElement("div");
            const isError = data.type === "error";
            toast.className = `toast px-5 py-3.5 rounded-xl text-sm font-medium border ${isError
                ? 'bg-red-950/80 text-red-300 border-red-800/30'
                : 'bg-emerald-950/80 text-emerald-300 border-emerald-800/30'}`;
            toast.innerHTML = `<div class="flex items-center gap-2.5">${isError
                ? '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
                : '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
            }<span>${data.message || "Done"}</span></div>`;
            document.getElementById("toast-container").appendChild(toast);
            setTimeout(() => { toast.classList.add("toast-out"); setTimeout(() => toast.remove(), 300); }, 3500);
        });
    </script>
</body>
</html>

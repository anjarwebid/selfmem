{% extends "base.html" %}
{% block title %}Memories - SelfMem{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h2 class="text-2xl font-bold">Memories</h2>
        <p class="text-sm text-gray-500 mt-1">{{ total }} memories for <span class="text-gray-300">{{ current_user }}</span></p>
    </div>
    <button onclick="document.getElementById('add-form').classList.toggle('hidden')"
            class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors">
        + Add Memory
    </button>
</div>

<!-- Add memory form (hidden by default) -->
<div id="add-form" class="hidden mb-6 bg-dark-800 border border-dark-600 rounded-xl p-5">
    <h3 class="text-sm font-semibold mb-3">New Memory</h3>
    <form hx-post="/ui/memories"
          hx-target="#memory-list"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('add-form').classList.add('hidden'); this.reset(); }">
        <input type="hidden" name="user_id" value="{{ current_user }}">
        <textarea name="content" rows="3" required placeholder="Memory content..."
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-600 mb-3"></textarea>
        <div class="flex gap-3 mb-3">
            <div class="flex-1">
                <input type="text" name="category" placeholder="Category (default: general)" list="category-list"
                       class="w-full bg-dark-900 border border-dark-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-600">
                <datalist id="category-list">
                    {% for cat in categories %}<option value="{{ cat }}">{% endfor %}
                </datalist>
            </div>
            <div class="flex-1">
                <input type="text" name="tags" placeholder="Tags (comma-separated)"
                       class="w-full bg-dark-900 border border-dark-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-600">
            </div>
        </div>
        <div class="flex justify-end gap-2">
            <button type="button" onclick="document.getElementById('add-form').classList.add('hidden')"
                    class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">Cancel</button>
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">Save</button>
        </div>
    </form>
</div>

<!-- Filters -->
<div class="flex gap-3 mb-4">
    <input type="text" name="query" id="search-input" placeholder="Search memories..."
           class="flex-1 bg-dark-800 border border-dark-600 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-600"
           hx-get="/ui/partials/memories"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#memory-list"
           hx-include="#filter-form"
           hx-indicator="#search-spinner">
    <select name="category" id="category-select"
            class="bg-dark-800 border border-dark-600 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"
            hx-get="/ui/partials/memories"
            hx-trigger="change"
            hx-target="#memory-list"
            hx-include="#filter-form">
        <option value="">All categories</option>
        {% for cat in categories %}
        <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
    </select>
    <span id="search-spinner" class="htmx-indicator text-gray-500 self-center">
        <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    </span>
</div>
<form id="filter-form" class="hidden">
    <input type="hidden" name="user_id" value="{{ current_user }}">
</form>

<!-- Memory list -->
<div id="memory-list">
    {% include "partials/memory_list.html" %}
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Memories - SelfMem{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-8">
    <div>
        <h2 class="text-2xl font-semibold text-white">Memories</h2>
        <p class="text-sm text-gray-600 mt-1"><span class="text-gray-400 font-mono">{{ total }}</span> entries for <span class="text-gray-400 font-mono">{{ current_user }}</span></p>
    </div>
    <div class="flex items-center gap-2">
        <button onclick="htmx.ajax('GET', '/ui/partials/memories?user_id={{ current_user if current_user != '__all__' else '' }}', {target:'#memory-list', swap:'outerHTML'})"
                class="p-2.5 text-gray-500 hover:text-cyan-400 bg-surface-800 border border-white/[0.06] rounded-lg hover:bg-surface-700 transition-all"
                title="Refresh">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <button onclick="document.getElementById('add-form').classList.toggle('hidden')"
                class="btn-primary bg-gradient-to-r from-cyan-600 to-cyan-700 hover:from-cyan-500 hover:to-cyan-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Add Memory
        </button>
    </div>
</div>

<!-- Add memory form -->
<div id="add-form" class="hidden mb-6 bg-surface-800 border border-white/[0.06] rounded-xl p-6">
    <h3 class="text-sm font-medium text-white mb-4">New Memory</h3>
    <form hx-post="/ui/memories"
          hx-target="#memory-list"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('add-form').classList.add('hidden'); this.reset(); }">
        <input type="hidden" name="user_id" value="{{ current_user }}">
        <textarea name="content" rows="3" required placeholder="Memory content..."
                  class="w-full bg-surface-900 border border-white/[0.06] rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-accent/30 focus:border-accent/30 placeholder-gray-700 mb-4 transition-all"></textarea>
        <div class="flex gap-3 mb-4">
            <div class="flex-1">
                <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-1.5">Category</label>
                <input type="text" name="category" placeholder="general" list="category-list"
                       class="w-full bg-surface-900 border border-white/[0.06] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-accent/30 placeholder-gray-700 transition-all">
                <datalist id="category-list">
                    {% for cat in categories %}<option value="{{ cat }}">{% endfor %}
                </datalist>
            </div>
            <div class="flex-1">
                <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-1.5">Tags</label>
                <input type="text" name="tags" placeholder="comma-separated"
                       class="w-full bg-surface-900 border border-white/[0.06] rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-accent/30 placeholder-gray-700 transition-all">
            </div>
        </div>
        <div class="flex justify-end gap-3">
            <button type="button" onclick="document.getElementById('add-form').classList.add('hidden')"
                    class="px-4 py-2 text-sm text-gray-500 hover:text-gray-300 transition-colors">Cancel</button>
            <button type="submit"
                    class="bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">Save</button>
        </div>
    </form>
</div>

<!-- Filters -->
<div class="flex gap-3 mb-5">
    <div class="flex-1 search-wrap bg-surface-800 border border-white/[0.06] rounded-xl transition-all">
        <div class="flex items-center px-4">
            <svg class="w-4 h-4 text-gray-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" name="query" id="search-input" placeholder="Search memories..."
                   class="w-full bg-transparent px-3 py-3 text-sm focus:outline-none placeholder-gray-700"
                   hx-get="/ui/partials/memories"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#memory-list"
                   hx-include="#filter-form"
                   hx-indicator="#search-spinner">
        </div>
    </div>
    <select name="category" id="category-select"
            class="bg-surface-800 border border-white/[0.06] rounded-xl px-4 py-3 text-sm text-gray-400 focus:outline-none focus:border-accent/30 transition-all"
            hx-get="/ui/partials/memories"
            hx-trigger="change"
            hx-target="#memory-list"
            hx-include="#filter-form">
        <option value="">All categories</option>
        {% for cat in categories %}
        <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
    </select>
    <span id="search-spinner" class="htmx-indicator text-cyan-500 self-center">
        <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    </span>
</div>
<form id="filter-form" class="hidden">
    <input type="hidden" name="user_id" value="{{ current_user }}">
</form>

<!-- Memory list -->
<div id="memory-list">
    {% include "partials/memory_list.html" %}
</div>
{% endblock %}

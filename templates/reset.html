<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — SelfMem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-[#08080c] text-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="bg-[#0e0e14] border border-white/[0.06] rounded-2xl p-8">
            <h1 class="text-xl font-semibold text-white tracking-tight mb-6">Set new password</h1>
            {% if error %}<div class="mb-5 px-4 py-3 rounded-lg bg-red-950/50 border border-red-800/30 text-red-300 text-sm">{{ error }}</div>{% endif %}
            {% if token %}
            <form method="POST" action="/ui/reset/{{ token }}" class="space-y-4">
                <div>
                    <label class="block text-[10px] text-gray-600 uppercase tracking-widest font-mono mb-2">New password</label>
                    <input type="password" name="password" required minlength="8" autofocus
                           class="w-full bg-[#16161f] border border-white/[0.06] rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500/30">
                </div>
                <button type="submit"
                        class="w-full bg-gradient-to-r from-cyan-600 to-cyan-700 hover:from-cyan-500 hover:to-cyan-600 text-white font-medium py-3 rounded-lg text-sm">
                    Update password
                </button>
            </form>
            {% else %}
            <p class="text-center text-[12px] text-gray-600">
                <a href="/ui/forgot" class="text-cyan-500/80 hover:text-cyan-400">Request a new reset link</a>
            </p>
            {% endif %}
        </div>
    </div>
</body>
</html>
